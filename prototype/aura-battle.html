        <div class="opp-name">${o.name}<span class="lvl">niveau ${i+1}</span></div>
        <div class="muted small">${o.desc}</div>
        <div class="reward">+${o.coins} pièces et +${o.aura} aura</div>
      </div>
      <button class="btn small" data-act="challenge" data-id="${o.id}">Défier</button>
    </div>`).join('')}</div>`;
}

function missionsHTML(){
  const d = ensureDaily();
  return `<div class="card"><div><div class="card-title">Défis du jour</div>${d.ids.map(id => {
    const m = byId(MISSIONS, id), pr = d.progress[id] || 0, done = pr >= m.goal, cl = d.claimed.includes(id);
    return `<div class="mission">
      <div class="m-top"><span>${m.text}</span><span class="reward">+${m.reward} 🪙</span></div>
      <div class="bar"><div style="width:${pr/m.goal*100}%"></div></div>
      <div class="row"><span class="muted small">${cl ? 'Récompense récupérée' : `${pr} sur ${m.goal}`}</span>${done && !cl ? `<button class="btn small gold" data-act="claim" data-id="${id}">Récupérer</button>` : ''}</div>
    </div>`;
  }).join('')}</div></div>`;
}

function lookEditor(key, label, where){
  const d = save.duo[key];
  const chip = (k, it) => `<button class="chip ${d[k]===it.id?'on':''}" data-act="duoSet" data-side="${key}" data-key="${k}" data-id="${it.id}" aria-pressed="${d[k]===it.id}"><span>${it.name}</span></button>`;
  return `<section class="setup">
    <h2 class="sec">${label} <span class="muted small">${where}</span></h2>
    <div class="group">Couleur d'aura</div>
    <div class="swatches">${COLORS.map(c => `<button class="swatch ${d.color===c.id?'on':''}" style="background:${c.hex}" data-act="duoSet" data-side="${key}" data-key="color" data-id="${c.id}" aria-label="${c.name}" aria-pressed="${d.color===c.id}"></button>`).join('')}</div>
    <div class="group">Coiffure</div>
    <div class="chips">${HAIRS.map(h => chip('hair', h)).join('')}</div>
    <div class="group">Tenue</div>
    <div class="chips">${OUTFITS.map(o => chip('outfit', o)).join('')}</div>
    <div class="group">Teint</div>
    <div class="swatches">${SKINS.map((sk,i) => `<button class="swatch ${d.skin===sk?'on':''}" style="background:${sk}" data-act="duoSet" data-side="${key}" data-key="skin" data-id="${sk}" aria-label="Teint ${i+1}" aria-pressed="${d.skin===sk}"></button>`).join('')}</div>
  </section>`;
}

function duoSetupHTML(){
  return `<div class="phase-title">Duel à deux</div>
  <p class="lead">Tout est débloqué, mais chaque joueur n'a que ${DUO_ENERGY} points d'énergie pour tout le match. Le premier à ${WIN_ROUNDS} manches gagne. Surveille les styles déjà joués par l'autre pour le contrer. La recharge avant chaque tour peut te rendre de l'énergie.</p>
  ${lookEditor('left', 'Joueur 1', 'à gauche')}
  ${lookEditor('right', 'Joueur 2', 'à droite')}
  <button class="btn" data-act="startDuo">Lancer le duel</button>
  <button class="btn ghost" data-act="back">Annuler</button>`;
}

function passHTML(){
  const sd = B.sides[B.cur], other = B.sides[otherKey(B.cur)];
  const prev = B.turn > 0;
  return `<div class="pass">
    <span class="pass-dot" style="background:${sd.f.color}"></span>
    <div class="muted small">Manche ${B.round}</div>
    <div class="phase-title">Au tour du ${sd.name}</div>
    <p class="lead">${prev ? `L'aura du ${other.name} est verrouillée. ` : ''}Passe le téléphone au ${sd.name}. ${other.name}, ne regarde pas l'écran.</p>
  </div>
  <button class="btn" data-act="ready">C'est moi, ${sd.name}</button>`;
}

function chooseHTML(){
  const sd = B.sides[B.cur], other = B.sides[otherKey(B.cur)], duo = B.mode === 'duo';
  const poses = POSES.filter(p => sd.poses.includes(p.id));
  const anims = ANIMS.filter(a => sd.anims.includes(a.id));
  const p = byId(POSES, sd.sel.pose), a = byId(ANIMS, sd.sel.anim);
  const rep = sd.used.includes(p.id);
  const ready = sd.ult >= ULT_MAX;
  const est = Math.round(p.power * a.mult * (rep ? .7 : 1) * (sd.sel.ult && ready ? ULT_MULT : 1) * (1 + sd.boost/100));
  const cost = p.cost + a.cost;
  const over = duo && cost > sd.energy;
  const title = duo ? `${sd.name}, manche ${B.round}` : `Manche ${B.round}`;
  const counterStyle = B.tell ? beaterOf(B.tell) : null;

  let intel = '';
  if(!duo && B.tell){
    const o = B.opp;
    intel = `<div class="tell"><p>${o.name} semble préparer une pose <b>${styleLabel(B.tell)}</b>.</p>
      <p class="muted small">Pour le contrer : ${styleLabel(counterStyle)}.${o.honest < .7 ? ' Attention, il lui arrive de bluffer.' : ''}${o.read > .3 ? ' Il se souvient aussi de ton dernier style.' : ''}${B.sides.right.ult >= ULT_MAX ? " Sa jauge d'Ultime est pleine." : ''}</p></div>`;
  }
  const hist = other.styles.length ? `<p class="rule">${other.name} a déjà joué : ${other.styles.map(s => STYLES[s].icon).join(' ')}</p>` : '';

  const poseChip = x => {
    const off = duo && x.cost > sd.energy;
    const used = sd.used.includes(x.id);
    const isCounter = counterStyle && x.style === counterStyle;
    return `<button class="chip ${sd.sel.pose===x.id?'on':''} ${used?'used':''} ${isCounter?'counter':''}" data-act="pose" data-id="${x.id}" aria-pressed="${sd.sel.pose===x.id}" ${off?'disabled':''}><span>${STYLES[x.style].icon} ${x.name}</span><small>puissance ${x.power}${duo?`, ⚡${x.cost}`:''}${used?', déjà vue':''}</small></button>`;
  };
  const animChip = x => {
    const off = duo && x.cost > sd.energy;
    return `<button class="chip ${sd.sel.anim===x.id?'on':''}" data-act="anim" data-id="${x.id}" aria-pressed="${sd.sel.anim===x.id}" ${off?'disabled':''}><span>${x.name}</span><small>×${x.mult}${duo?`, ⚡${x.cost}`:''}</small></button>`;
  };
  const counterNote = counterStyle ? (p.style === counterStyle ? ' <span class="ok">contre prévu, ×1,35</span>' : (STYLES[B.tell].beats === p.style ? ' <span class="warn">risque d\'être contré</span>' : '')) : '';

  return `<div class="phase-title">${title}</div>
  ${intel}
  ${duo ? `<p class="estimate">Énergie restante : <b>${sd.energy}</b> sur ${DUO_ENERGY}. Ce choix coûte <b>${cost}</b>.</p>` : ''}
  <div class="group">Pose</div>
  <p class="rule">${RULE_LINE}</p>
  ${hist}
  <div class="chips">${poses.map(poseChip).join('')}</div>
  <div class="group">Animation d'aura</div>
  <div class="chips">${anims.map(animChip).join('')}</div>
  <div class="group">Ultime</div>
  <div class="ult-row"><div class="ult-meter"><i style="width:${sd.ult/ULT_MAX*100}%"></i></div>${ready
    ? `<button class="chip ultchip ${sd.sel.ult?'on':''}" data-act="ult" aria-pressed="${sd.sel.ult}"><span>${sd.sel.ult ? 'Ultime activé' : "Activer l'Ultime"}</span><small>×1,5 et impossible à contrer</small></button>`
    : `<span class="muted small">${sd.ult} sur ${ULT_MAX}</span>`}</div>
  <p class="estimate">Aura de base : <b>${est}</b>${sd.boost ? ` <span class="ok">recharge +${sd.boost} %</span>` : ''}${counterNote}${rep ? ' <span class="warn">pose déjà vue, −30 %</span>' : ''}${over ? ' <span class="warn">pas assez d\'énergie</span>' : ''}</p>
  <button class="btn" data-act="charge" ${over?'disabled':''}>Charger l'aura</button>
  <button class="btn ghost" data-act="flee">${duo ? 'Abandonner' : 'Fuir le combat'}</button>`;
}

function rechargeHTML(){
  const sd = B.sides[B.cur], rc = B.rc, duo = B.mode === 'duo';
  const title = duo ? `${sd.name}, recharge` : `Manche ${B.round}, recharge`;
  if(!rc.running && !rc.done){
    return `<div class="phase-title">${title}</div>
    <p class="lead">Touche un maximum d'orbes dans l'arène en ${RC_DUR/1000} secondes. Elles apparaissent à des endroits différents et disparaissent vite. Les dorées valent 3 points, et à partir de 10 d'affilée chaque orbe rapporte 1 point de plus. Toucher dans le vide casse ton combo.</p>
    <p class="muted small">Chaque point donne +1 % d'aura pour cette manche (${RC_BOOST_CAP} % maximum) et remplit ta jauge d'Ultime${duo ? ". Tous les 8 points, tu récupères aussi 1 énergie (2 maximum)" : ''}.</p>
    <button class="btn big" data-act="rcStart">Commencer la recharge</button>
    <button class="btn ghost" data-act="rcSkip">Passer la recharge</button>`;
  }
  if(rc.running){
    return `<div class="phase-title">Touche les orbes</div>
    <div class="rc-stats"><div><b id="rcHits">${rc.hits}</b><span>points</span></div><div><b id="rcCombo">${rc.combo}</b><span>combo</span></div><div><b id="rcTime">${Math.ceil(RC_DUR/1000)}</b><span>secondes</span></div></div>
    <p class="hint">Les orbes apparaissent dans l'arène, juste au-dessus.</p>`;
  }
  const g = rc.gain;
  const ai = duo ? '' : `<p class="muted small">${B.opp.name} a rechargé ${B.sides.right.rcHits} points de son côté.</p>`;
  return `<div class="phase-title">Recharge terminée</div>
  <div class="rc-stats"><div><b>${rc.hits}</b><span>points</span></div><div><b>${rc.best}</b><span>meilleur combo</span></div></div>
  <p class="estimate">+${g.boost} % d'aura pour cette manche, +${g.ultGain} d'Ultime${g.energyGain ? `, +${g.energyGain} énergie` : ''}.</p>
  ${ai}
  <button class="btn" data-act="rcDone">Choisir ma pose</button>`;
}

function timingHTML(){
  const m = B.meter, sd = B.sides[B.cur];
  const title = B.mode === 'duo' ? `${sd.name}, manche ${B.round}` : `Manche ${B.round}`;
  return `<div class="phase-title">${title}</div>
  <p class="lead">Lâche ton aura quand le curseur passe dans la zone violette. Le centre doré donne un timing parfait.</p>
  <div class="meter">
    <div class="zone" style="left:${(m.center-m.zone/2)*100}%;width:${m.zone*100}%"></div>
    <div class="perfect" style="left:${(m.center-m.perf/2)*100}%;width:${m.perf*100}%"></div>
    <div class="cursor" id="cursor"></div>
  </div>
  <button class="btn big" data-act="release">Lâcher l'aura</button>
  <p class="hint">Tu peux aussi toucher l'arène ou appuyer sur Espace.</p>`;
}

function revealHTML(){
  return `<div class="phase-title">Manche ${B.round}</div><div class="log" id="log"></div><div id="after"></div>`;
}

function resultHTML(){
  const r = B.result;
  const roundsTxt = `${r.rL} manche${r.rL>1?'s':''} à ${r.rR}`;
  if(B.mode === 'duo'){
    const w = r.winner ? B.sides[r.winner] : null;
    const title = w ? `${w.name} gagne` : 'Égalité';
    const flavor = r.fled ? `Le ${B.sides[r.fled].name} a abandonné. Grosse perte d'aura.` : (w ? 'Aura supérieure confirmée devant tout le public.' : 'Deux auras parfaitement égales. Personne ne bouge.');
    return `<div class="result ${w ? 'win' : ''}">
      <div class="result-title duo">${title}</div>
      <div class="result-score">${roundsTxt}. Aura totale : Joueur 1 ${r.L}, Joueur 2 ${r.R}.</div>
      <p class="muted">Contres réussis : Joueur 1 ${B.sides.left.counters}, Joueur 2 ${B.sides.right.counters}. ${flavor}</p>
    </div>
    <button class="btn" data-act="rematch">Revanche</button>
    <button class="btn ghost" data-act="back">Retour à l'arène</button>`;
  }
  const res = r.winner === 'left' ? 'win' : (r.winner === 'right' ? 'lose' : 'tie');
  const title = res === 'win' ? 'Victoire' : (res === 'lose' ? (r.fled ? 'Fuite' : 'Défaite') : 'Égalité');
  const flavor = res === 'win' ? 'Le public est encore sous le choc.'
    : res === 'tie' ? 'Deux auras égales. Personne ne bouge.'
    : r.fled ? "Fuir, c'est la pire perte d'aura possible."
    : 'Observe mieux ses bluffs et contre-le la prochaine fois.';
  let auraTxt;
  if(r.dA > 0) auraTxt = `+${r.dA} aura`;
  else if(r.dA < 0) auraTxt = `−${-r.dA} aura`;
  else auraTxt = res === 'lose' ? 'Aucune aura à perdre' : '+0 aura';
  const Ls = B.sides.left;
  const bonusParts = [];
  if(res === 'win' && Ls.perfects) bonusParts.push(`${Ls.perfects*10} pour les timings parfaits`);
  if(res === 'win' && Ls.counters) bonusParts.push(`${Ls.counters*15} pour les contres`);
  const bonus = bonusParts.length ? `<p class="muted small">Dont ${bonusParts.join(' et ')}.</p>` : '';
  return `<div class="result ${res}">
    <div class="result-title">${title}</div>
    <div class="result-score">${r.fled ? 'Combat abandonné' : roundsTxt}</div>
    <div class="rewards"><div>${auraTxt}</div><div>+${r.dC} pièces</div></div>
    ${bonus}
    <p class="muted">${flavor}</p>
  </div>
  <button class="btn" data-act="rematch">Rejouer contre ${B.opp.name}</button>
  <button class="btn ghost" data-act="back">Retour à l'arène</button>`;
}

function shopHTML(){
  const sec = (title, kind, items, stat) => `<section class="shop-sec"><h2 class="sec">${title}</h2>${items.map(it => {
    const owned = save[kind+'s'].includes(it.id);
    const eq = save.equip[kind] === it.id;
    const can = save.coins >= it.price;
    const action = owned
      ? `<button class="btn small ${eq?'ghost':''}" data-act="equip" data-kind="${kind}" data-id="${it.id}" ${eq?'disabled':''}>${eq?'Équipée':'Équiper'}</button>`
      : `<button class="btn small gold" data-act="buy" data-kind="${kind}" data-id="${it.id}" ${can?'':'disabled'}>🪙 ${it.price}</button>`;
    return `<div class="item ${preview[kind]===it.id?'prev':''}" data-act="preview" data-kind="${kind}" data-id="${it.id}" tabindex="0">
      <div class="item-main">${kind==='color' ? `<span class="sw" style="background:${it.hex}"></span>` : ''}
        <div><div class="item-name">${it.name}${kind==='pose' ? animTag(it) : ''}</div><div class="muted small">${stat(it)}</div></div>
      </div>${action}</div>`;
  }).join('')}</section>`;
  return `<p class="lead">Touche un objet pour l'essayer dans l'arène. Avoir des poses des trois styles te permet de contrer n'importe qui.</p>`
    + sec('Poses', 'pose', POSES, it => `${styleLabel(it.style)}, puissance ${it.power}`)
    + sec("Animations d'aura", 'anim', ANIMS, it => `Multiplicateur ×${it.mult}`)
    + sec('Coiffures', 'hair', HAIRS, () => 'Style du personnage')
    + sec('Tenues', 'outfit', OUTFITS, () => 'Style du personnage')
    + `<section class="shop-sec"><h2 class="sec">Teint</h2><div class="swatches">${SKINS.map((sk,i) => `<button class="swatch ${save.equip.skin===sk?'on':''}" style="background:${sk}" data-act="skin" data-id="${sk}" aria-label="Teint ${i+1}" aria-pressed="${save.equip.skin===sk}"></button>`).join('')}</div></section>`
    + sec("Couleurs d'aura", 'color', COLORS, () => 'Effet visuel uniquement');
}

function profileHTML(){
  const r = rankOf(save.aura);
  const idx = RANKS.indexOf(r), next = RANKS[idx+1];
  const pct = next ? Math.round((save.aura - r.min) / (next.min - r.min) * 100) : 100;
  const st = save.settings;
  return `<div class="profile">
    <div class="rank-big">${r.name}</div>
    <div class="muted">${save.aura} points d'aura</div>
    ${next ? `<div class="bar"><div style="width:${pct}%"></div></div><div class="muted small">Encore ${next.min - save.aura} aura pour atteindre ${next.name}.</div>` : `<div class="muted small">Rang maximum atteint.</div>`}
    <div class="kv"><div><b>${save.wins}</b><span>victoires</span></div><div><b>${save.losses}</b><span>défaites</span></div></div>
    <h2 class="sec">Son</h2>
    <div class="toggles">
      <button class="chip ${st.sfx?'on':''}" data-act="toggleSfx" aria-pressed="${st.sfx}"><span>Effets sonores</span><small>${st.sfx?'activés':'coupés'}</small></button>
      <button class="chip ${st.music?'on':''}" data-act="toggleMusic" aria-pressed="${st.music}"><span>Musique</span><small>${st.music?'activée':'coupée'}</small></button>
    </div>
    <h2 class="sec">Rangs</h2>
    <ol class="ranks">${RANKS.map(x => `<li class="${x===r?'me':''}">${x.name} <span class="muted small">dès ${x.min} aura</span></li>`).join('')}</ol>
    <button class="btn ghost" data-act="reset">${resetArmed ? 'Confirmer : tout effacer' : 'Recommencer à zéro'}</button>
  </div>`;
}

function renderPanel(){
  let html;
  if(B.setup) html = duoSetupHTML();
  else if(B.active){
    html = ({pass:passHTML, recharge:rechargeHTML, choose:chooseHTML, timing:timingHTML, reveal:revealHTML, result:resultHTML})[B.phase]();
  } else {
    html = tab === 'arena' ? lobbyHTML() : tab === 'shop' ? shopHTML() : profileHTML();
  }
  panel.innerHTML = html;
}

/* ================= Actions ================= */
function buy(kind, id){
  const it = byId(LISTS[kind], id);
  if(!it || save[kind+'s'].includes(id) || save.coins < it.price) return;
  save.coins -= it.price;
  save[kind+'s'].push(id);
  save.equip[kind] = id;
  preview[kind] = null;
  persist(); renderTop(); applyLook();
  player.pulseUntil = performance.now() + 1400;
  player.sqT = wt;
  sparkBurst(player.x, player.cy, 30, [player.color, '#ffffff'], 220);
  popup(player.x, topOf(player), 'Débloqué', '#ffcf3f', 18);
  Sound.play('buy');
  renderPanel();
}

panel.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const {act, id, kind} = el.dataset;
  const sd = B.active ? B.sides[B.cur] : null;
  switch(act){
    case 'challenge': Sound.play('click'); startSolo(id); break;
    case 'duoSetup': Sound.play('click'); enterDuoSetup(); break;
    case 'duoSet': {
      const {side, key} = el.dataset;
      save.duo[side][key] = id; persist(); applyDuoLooks();
      (side === 'left' ? player : foe).pulseUntil = performance.now() + 900;
      Sound.play('select');
      renderPanel(); break;
    }
    case 'startDuo': Sound.play('click'); startDuo(); break;
    case 'ready': Sound.play('chime'); B.phase = 'recharge'; initRecharge(); renderPanel(); window.scrollTo({top:0}); break;
    case 'rcStart': startRecharge(); window.scrollTo({top:0}); break;
    case 'rcSkip': Sound.play('click'); finishRecharge(); break;
    case 'rcDone': Sound.play('click'); B.phase = 'choose'; renderPanel(); window.scrollTo({top:0}); break;
    case 'pose':
      sd.sel.pose = id;
      if(B.mode === 'solo') sd.f.pose = id;
      Sound.play('select');
      renderPanel(); break;
    case 'anim':
      sd.sel.anim = id;
      if(B.mode === 'solo') setAnim(sd.f, id);
      Sound.play('select');
      renderPanel(); break;
    case 'charge': startTiming(); break;
    case 'ult': sd.sel.ult = !sd.sel.ult; Sound.play(sd.sel.ult ? 'chime' : 'select'); renderPanel(); break;
    case 'claim': {
      const d = ensureDaily(), m = byId(MISSIONS, id);
      if(m && (d.progress[id] || 0) >= m.goal && !d.claimed.includes(id)){
        d.claimed.push(id); save.coins += m.reward; persist(); renderTop();
        Sound.play('buy'); buzz(30);
        player.pulseUntil = performance.now() + 1200; player.sqT = wt;
        sparkBurst(player.x, player.cy, 30, ['#ffcf3f','#ffffff'], 220);
        popup(player.x, topOf(player), `+${m.reward}`, '#ffcf3f', 22);
      }
      renderPanel(); break;
    }
    case 'release': release(); break;
    case 'next': Sound.play('click'); nextRound(); break;
    case 'flee': endBattle(B.cur); break;
    case 'rematch': Sound.play('click'); if(B.mode === 'duo') startDuo(); else startSolo(B.opp.id); break;
    case 'back': Sound.play('click'); backToLobby(); break;
    case 'buy': buy(kind, id); break;
    case 'equip': save.equip[kind] = id; preview[kind] = null; persist(); applyLook(); player.pulseUntil = performance.now() + 900; player.sqT = wt; Sound.play('select'); renderPanel(); break;
    case 'skin': save.equip.skin = id; persist(); applyLook(); Sound.play('select'); renderPanel(); break;
    case 'preview': preview[kind] = id; applyLook(); player.pulseUntil = performance.now() + 1200; Sound.play('select'); renderPanel(); break;
    case 'toggleSfx': save.settings.sfx = !save.settings.sfx; persist(); Sound.applySettings(); renderTop(); Sound.play('select'); renderPanel(); break;
    case 'toggleMusic': save.settings.music = !save.settings.music; persist(); Sound.applySettings(); renderTop(); Sound.play('select'); renderPanel(); break;
    case 'reset':
      if(!resetArmed){ resetArmed = true; renderPanel(); }
      else {
        const keep = save.settings;
        save = defaultSave(); save.settings = keep; persist();
        resetArmed = false; preview = emptyPreview(); applyLook(); renderTop(); renderPanel();
      }
      break;
  }
});

panel.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item')){ e.preventDefault(); e.target.click(); }
});

tabsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if(!b || B.active || B.setup) return;
  tab = b.dataset.tab;
  resetArmed = false;
  preview = emptyPreview();
  applyLook();
  tabsEl.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  Sound.play('click');
  renderPanel();
  window.scrollTo({top:0});
});

$('#muteBtn').addEventListener('click', () => {
  const on = save.settings.sfx || save.settings.music;
  save.settings.sfx = !on; save.settings.music = !on;
  persist(); Sound.init(); Sound.applySettings(); renderTop();
  if(!B.active && !B.setup && tab === 'profile') renderPanel();
});

cv.addEventListener('pointerdown', e => {
  if(B.phase === 'timing') release();
  else if(B.phase === 'recharge' && B.rc && B.rc.running){
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    rechargeTap(e.clientX - r.left, e.clientY - r.top);
  }
});
document.addEventListener('keydown', e => {
  if(B.phase === 'timing' && (e.code === 'Space' || e.key === ' ')){ e.preventDefault(); release(); }
});

/* ================= Lancement ================= */
init3D();
resize();
applyLook();
renderTop();
renderPanel();
requestAnimationFrame(frame);
</script>
</body>
</html>
